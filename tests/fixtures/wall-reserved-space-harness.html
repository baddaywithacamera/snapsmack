<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wall reserved space</title>
<link rel="stylesheet" href="/assets/css/ss-engine-scroll-wall.css">
<style>
  /* Only what a page needs to exist. Everything that decides tile geometry
     comes from the real stylesheet above, which is the point of the test. */
  body { margin: 0; font: 14px sans-serif; }
  /* A real archive carries these from the owner's Archive Appearance
     controls. --ss-row-height is JUSTIFIED ROW HEIGHT, which BOTH the
     parse-time fallback and ss-engine-rows.js target. Without it the
     engine falls back to deriving a height from --ss-cols, and the two
     would be aiming at different numbers. */
  #justified-grid { width: 1200px; --ss-row-height: 220px; --ss-gap: 8px; }
  /* The marker whose top edge tells us whether the wall reserved any height.
     If the wall collapses, this sits at the top of the page and then snaps
     down when the engine runs -- which is the defect being measured. */
  #below { height: 20px; background: #c00; }
</style>
</head>

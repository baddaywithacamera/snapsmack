<!doctype html><html><head><meta charset="utf-8"><style>/**
 * SNAPSMACK - Public Base Styles
 *
 * Loaded on every public-facing page. Contains:
 *   - Utility classes shared by all pages (alignment, sizing)
 *   - Inline image frame styling (parser shortcodes)
 *   - Content link defaults (description / static page links)
 *   - Reverse-email anti-scraper helper
 *   - Engine-required structural rules (image fade-load opacity:0)
 *   - Landing-only mode header hide
 *   - Tablet touch target enlargement
 *
 * Skin's style.css loads AFTER this file and overrides freely.
 *
 * SKIN AUTHORS: most of this is utility/structural. Override decorative
 * bits (link colour, hover) in your skin freely. Do NOT override the image
 * fade-load opacity:0 rule — the JS engine depends on it.
 */

/*
 * SNAPSMACK_EOF_HEADER
 * Last non-empty line MUST be the canonical CSS EOF marker:
 *   slash-star, space, five equals, space, 'SNAPSMACK EOF', space, five equals, space, star-slash.
 */


/* ─── 1. GLOBAL ASSET CONTAINER ──────────────────────────────────────────── */
.snapsmack-asset {
    display: block;
    height: auto;
    max-width: 100%;
    margin-top: 25px;
    margin-bottom: 25px;
}

/* ─── 2. SIZE UTILITIES ──────────────────────────────────────────────────── */
.asset-small  { width: 300px !important; }
.asset-medium { width: 600px !important; }
.asset-full   { width: 100%  !important; }

/* ─── 3. ALIGNMENT UTILITIES ─────────────────────────────────────────────── */
.align-left  { float: left;  margin-right: 25px; margin-bottom: 15px; }
.align-right { float: right; margin-left:  25px; margin-bottom: 15px; }
.align-center {
    float: none;
    margin-left: auto;
    margin-right: auto;
    clear: both;
}

/* ─── 4. INLINE IMAGE FRAMES (parser shortcodes) ─────────────────────────── */
.snap-inline-frame {
    width: min(var(--snap-image-width, 100%), 100%);
    max-width: 100%;
    margin: 1.5em auto;
    text-align: center;
}
.snap-inline-frame.align-left  { float: left;  margin: 0.25em 1.5em 1em 0; }
.snap-inline-frame.align-right { float: right; margin: 0.25em 0 1em 1.5em; }
.snap-inline-frame img {
    width: 100%;
    max-width: 100%;
    height: auto;
    display: block;
}

@media (max-width: 640px) {
    .snap-inline-frame {
        width: 100%;
        float: none;
        margin-left: auto;
        margin-right: auto;
    }
}

/* ─── 5. CONTENT LINKS (base fallback) ───────────────────────────────────── */
.description a,
.static-content a:not(.nav-menu a) {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
}
.description a:hover,
.static-content a:not(.nav-menu a):hover {
    opacity: 0.8;
}
.description a:has(img),
.static-content a:has(img),
.snap-inline-frame a,
.description a img,
.static-content a img {
    text-decoration: none !important;
    border-bottom: none !important;
}

/* ─── 6. CLEARFIX (floated images don't overflow sections) ───────────────── */
.description::after,
.static-content::after,
.post-content::after {
    content: "";
    display: table;
    clear: both;
}

/* ─── 7. REVERSE-EMAIL (anti-scraper, applied to footer email) ───────────── */
.reverse-email {
    display: inline-block;
    unicode-bidi: bidi-override;
    direction: rtl;
}

/* ─── 8. LANDING-ONLY MODE (hides skin headers when active) ──────────────── */
body.landing-only #header,
body.landing-only .ge-header,
body.landing-only .pickup-header,
body.landing-only .snt-header,
body.landing-only .tg-topbar { display: none; }

/* ─── 9. TABLET TOUCH TARGETS ────────────────────────────────────────────── */
@media (pointer: coarse) {
    .nav-menu a,
    .nav-links a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
    }
}

/* ─── 10. ENGINE: image fade-load (DO NOT OVERRIDE) ──────────────────────── */
/* Initial opacity:0 so half-decoded images don't flash before paint.
   ss-engine-image-fade-load.js transitions to opacity:1 on `load`. */
.post-image,
.fsog-image,
.pg-post-image,
.tg-image,
img[data-lightbox-src] {
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
    /* Safety net. These start invisible and ss-engine-image-fade-load.js
       reveals them. If that script is ever missing, blocked or broken, every
       photograph on the page stays invisible -- which is why this stylesheet
       was held back from the strict skins rather than shipped, and why they
       went without the alignment and inline-frame rules they needed. The
       animation forces full opacity shortly after paint whatever happens to
       the script; when the script works it sets opacity inline first and
       nothing here is ever seen. */
    animation: snap-image-reveal-safety 0s linear 2.5s forwards;
}

@keyframes snap-image-reveal-safety {
    to { opacity: 1; }
}

/* ─── 11. NOT FOUND / EMPTY STATE (shared) ───────────────────────────────── */
.not-found-msg {
    text-align: center;
    padding: 80px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.2rem;
    color: var(--text-dim, #999);
}
/* Feed paging sentinel (ss-engine-tag-infinite.js): an invisible full-width
   row at the end of a paged landing grid. Fetching the next page starts when
   it scrolls within reach. */
.ss-feed-sentinel { grid-column: 1 / -1; height: 1px; margin: 0; padding: 0; }

/* Editor-only notice overlays the real skin instead of replacing its layout. */
.snap-preview-notice {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 2147483647;
    padding: 6px 10px;
    border: 1px solid #666;
    background: #111;
    color: #fff;
    font: 11px/1.4 sans-serif;
    letter-spacing: 1px;
    pointer-events: none;
}

/* Opt-in primary scroll surfaces only; nested controls retain their own scrollbars. */
:is(html:has(body.ss-subtle-scrollbars), body.ss-subtle-scrollbars, .ss-scroll-surface) {
    scrollbar-color: var(--ss-scroll-thumb, #777777) transparent;
    scrollbar-width: auto;
}
body.ss-subtle-scrollbars > :not(.ss-scroll-surface), .ss-scroll-surface > * {
    scrollbar-color: auto;
    scrollbar-width: auto;
}
@supports selector(::-webkit-scrollbar) {
    :is(html:has(body.ss-subtle-scrollbars), body.ss-subtle-scrollbars, .ss-scroll-surface) { scrollbar-color: auto; }
    :is(html:has(body.ss-subtle-scrollbars), body.ss-subtle-scrollbars, .ss-scroll-surface)::-webkit-scrollbar { width: 12px; height: 12px; }
    :is(html:has(body.ss-subtle-scrollbars), body.ss-subtle-scrollbars, .ss-scroll-surface)::-webkit-scrollbar-track,
    :is(html:has(body.ss-subtle-scrollbars), body.ss-subtle-scrollbars, .ss-scroll-surface)::-webkit-scrollbar-corner { background: transparent; }
    :is(html:has(body.ss-subtle-scrollbars), body.ss-subtle-scrollbars, .ss-scroll-surface)::-webkit-scrollbar-thumb {
        background: var(--ss-scroll-thumb, #777777);
        border: 3px solid transparent;
        background-clip: padding-box;
        border-radius: 8px;
    }
    :is(html:has(body.ss-subtle-scrollbars), body.ss-subtle-scrollbars, .ss-scroll-surface)::-webkit-scrollbar-thumb:hover { background-color: var(--ss-scroll-thumb-hover, #999999); }
    :is(html:has(body.ss-subtle-scrollbars), body.ss-subtle-scrollbars, .ss-scroll-surface)::-webkit-scrollbar-thumb:active { background-color: var(--ss-scroll-thumb-active, #aaaaaa); }
}

/**
 * SNAPSMACK - Stylesheet for the new-horizon skin
 * Alpha v0.7.5
 */

/*
 * SNAPSMACK_EOF_HEADER
 * Last non-empty line of this file MUST be the canonical CSS EOF
 * marker: slash-star, space, five equals, space, the literal string
 * 'SNAPSMACK EOF', space, five equals, space, star-slash.
 * (Authoritative byte sequence: tools/check-eof.py EOF_MARKERS['.css'].)
 * Missing or different = truncated/corrupted. Restore before saving.
 */




/* ==========================================================================
    GLOBAL STYLES
    ========================================================================= */

html {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: Georgia, 'Times New Roman', Times, serif;
    overflow: hidden;
}

body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: Georgia, 'Times New Roman', Times, serif;
    overflow-y: auto;
}

/* ==========================================================================
    LAYOUT STRUCTURE (SNAPPING ENGINE)
    ========================================================================= */

#page-wrapper {
    display: flex;
    flex-direction: column;
    height: 100dvh;
}

#scroll-stage {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    scroll-behavior: smooth;
    align-items: stretch;
    min-height: 0;
}

/* ==========================================================================
    HEADER (FIXED HEIGHT LOCK)
    ========================================================================= */

#header {
    background: var(--bg-page);
    height: 80px; /* FIXED: Absolute baseline */
    padding: 0;
    flex-shrink: 0;
    z-index: 20;
    position: relative;
    display: flex;
    align-items: center;
}

#header .inside {
    width: 100%;
    max-width: 95%;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center; 
    padding: 0 40px; 
}

/* SITE NAME / tagline on one line (Sean, 2026-09-16: "tagline BESIDE site name"). */
.logo-area {
    display: flex;
    align-items: baseline;
    gap: 4px 10px;
    flex-wrap: wrap;
    min-width: 0;
}

.site-tagline-text {
    margin: 0;
    line-height: 1.2;
    letter-spacing: .04em;
    font-weight: 400;
    text-transform: none;
}

.site-tagline-text::before {
    content: "/";
    margin-right: 10px;
    opacity: .55;
}

.site-title-text {
    /* Header typography comes from Skin Admin on this exact text element. */
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-bright);
    margin: 0;
    line-height: 1;
    display: block;
}

.logo-area a {
    text-decoration: none;
    color: var(--text-bright);
}

.site-logo {
    height: 50px;
    width: auto;
    display: block;
}

.nav-menu {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    align-items: center;
    white-space: nowrap;
}

.nav-menu a {
    color: var(--text-secondary);
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: color 0.2s ease;
}

.nav-menu a:hover, .nav-menu a.active {
    color: var(--text-bright);
}

.nav-menu .sep {
    padding: 0 15px;
    color: var(--text-faint);
    font-size: 0.9rem;
    cursor: default;
}

/* ==========================================================================
    PHOTOBOX & IMAGE (OPTICAL LIFT ENGINE)
    ========================================================================= */

#photobox {
    background: var(--bg-page);
    width: 100%;
    /* 1. Calculate Full Available Void: 100dvh - 80px (Header) - 60px (Infobox) */
    height: calc(100dvh - 140px);
    display: flex;
    justify-content: center;
    align-items: center;
    /* 2. OPTICAL LIFT: 50px bottom padding moves the center point UP by 25px */
    padding: 0 0 50px 0 !important;
    margin: 0 !important;
    box-sizing: border-box;
    overflow: hidden;
    flex-grow: 1;
    flex-shrink: 0 !important;
}

.main-photo {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px; /* Room for box-shadow frame — must exceed largest shadow spread (21px for Obsidian) */
    box-sizing: border-box;
}

.zoomable::after {
    content: none !important;
}

/* THE INDEX FRAME */
img.post-image {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    box-sizing: border-box;
    border: 5px solid var(--border-accent);
    box-shadow: none;
    cursor: zoom-in !important;
    outline: none !important;
}

/* ==========================================================================
    INFOBOX (FIXED HEIGHT LOCK)
    ========================================================================= */

#infobox {
    background: var(--bg-tertiary);
    border-top: 1px solid var(--border-primary);
    border-bottom: 1px solid var(--bg-page);
    height: 60px; /* FIXED: Absolute baseline */
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    position: relative;
    z-index: 10;
    flex-grow: 0 !important;
    flex-shrink: 0 !important;
    box-sizing: border-box; /* FIX: Include borders in 60px — prevents 2px scrollbar overflow */
}

.nav-links {
    display: inline-flex;
    align-items: center;
    gap: 40px;
    font-family: 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.nav-links .left,
.nav-links .center,
.nav-links .right {
    display: inline-flex;
    align-items: center;
    gap: 40px;
    margin: 0;
}

.nav-links a {
    color: var(--text-secondary);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 6px 0;
    display: inline-block;
}

.nav-links a:hover {
    color: var(--text-bright);
}

.nav-links .sep {
    color: var(--text-faint);
    font-size: 0.9rem;
}

.dim {
    color: var(--border-primary);
    font-weight: 600;
    font-size: 0.85rem;
}

/* ==========================================================================
    POST CONTENT DRAWER (UNIFIED ALIGNMENT)
    ========================================================================= */

#footer {
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-primary);
    padding: 52px 0 0 0; /* REDUCED 35% from 80px */
    text-align: left;
    display: none;
    width: 100%;
    flex-grow: 0 !important;
    flex-shrink: 0 !important;
}

.photo-title-footer,
#pane-info > .dt-published,
.description, 
.meta,
.comment-form,
#pane-comments {
    max-width: 850px;
    margin-left: auto;
    margin-right: auto;
    padding-left: 20px;
    padding-right: 20px;
    box-sizing: border-box;
}

/* The publication date belongs to the same information lane as its title. */
#pane-info > .dt-published {
    display: block;
    width: 100%;
    margin-top: 0;
    margin-bottom: 16px;
    color: var(--text-dim, #999);
    font-family: inherit;
    font-size: .8rem;
    line-height: 1.5;
}

.photo-title-footer {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--text-bright);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 2rem;
    margin: 0 auto 40px auto;
    font-weight: 700;
}

.description {
    font-family: Georgia, 'Times New Roman', Times, serif;
    line-height: 1.6;
    font-size: 1.2rem;
    color: var(--text-secondary);
    margin-bottom: 40px;
}

.description a,
.static-content a:not(.nav-menu a) {
    color: var(--text-bright);
    text-decoration: underline;
    text-underline-offset: 2px;
}

.description a:hover,
.static-content a:not(.nav-menu a):hover {
    color: var(--border-accent);
}

.description a:has(img),
.static-content a:has(img) {
    text-decoration: none !important;
    border-bottom: none !important;
}

/* ==========================================================================
    THE SIGNATURE (SYSTEM FOOTER STRIP)
    ========================================================================= */

#system-footer {
    background: var(--bg-chrome) !important;
    padding: 22px 0 !important; /* 50px -> 32px -> 22px: Sean 2026-09-16, "too phat", ~25% shorter */
    text-align: center !important;
    width: 100% !important;
    border-top: 1px solid var(--border-accent) !important;
    margin-top: auto;
    display: none;
}

#footer[style*="display: block"] ~ #system-footer,
#footer[style*="display:block"] ~ #system-footer {
    display: block !important;
}

#system-footer .inside {
    max-width: 95% !important;
    margin: 0 auto;
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-primary);
}

#system-footer p, #sig-text {
    color: var(--text-primary) !important;
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem !important;
    text-transform: uppercase !important;
    letter-spacing: 1.5px !important;
    margin: 0 !important;
}

/* ==========================================================================
    TECHNICAL SPECIFICATIONS (TYPEWRITER LOOK)
    ========================================================================= */

.meta {
    border-top: 1px solid var(--border-primary);
    padding-top: 40px;
    margin-top: 40px;
    text-align: center;
    padding-bottom: 60px;
}

.meta-header {
    margin-bottom: 25px;
    font-family: 'Inter', sans-serif;
    letter-spacing: 4px;
    font-size: 1.1rem;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 600;
}

.meta-header.no-signals {
    color: var(--text-link) !important;
}

.exif-table {
    margin: 0 auto;
    border-collapse: collapse;
    font-size: 0.9rem;
    text-align: left;
    width: auto;
}

.exif-label {
    padding-right: 40px;
    padding-bottom: 12px;
    color: var(--text-muted);
    font-weight: 900;
    text-transform: uppercase;
    font-family: sans-serif;
    width: 160px;
    vertical-align: top;
}

.exif-value {
    padding-bottom: 12px;
    color: var(--text-secondary);
    font-family: 'Courier New', Courier, monospace !important;
    font-size: 1.1em;
    letter-spacing: 0.5px;
}

/* ==========================================================================
    COMMENTS (FORM LAYOUT FIX)
    ========================================================================= */

.comment-form {
    border-top: 1px solid var(--border-dim);
    padding-top: 40px;
    margin-top: 40px;
    padding-bottom: 80px;
}

.form-row {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.comment-form input,
.comment-form textarea {
    background: var(--bg-page);
    color: var(--text-primary);
    border: 1px solid var(--border-primary);
    padding: 15px;
    font-family: "Courier New", Courier, monospace;
    font-size: 0.95rem;
    width: 100%;
    box-sizing: border-box;
}

.form-row input {
    flex: 1;
}

.comment-form textarea {
    height: 150px;
    resize: vertical;
}

.comment-form button {
    margin-top: 20px;
    background: var(--bg-tertiary);
    color: var(--text-dim);
    border: 1px solid var(--border-primary);
    padding: 12px 30px;
    cursor: pointer;
    font-family: sans-serif;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 1px;
    float: right;
}

/* ==========================================================================
    ARCHIVE GRID
   ========================================================================= */

/* --- GRID A: Square & Cropped (CSS Grid layout) --- */
#browse-grid {
    width: var(--ss-grid-width, 100%);
    box-sizing: border-box;
    max-width: 95%;
    margin: 80px auto;
    padding: 0 60px;
    flex: 1 0 auto;
}

/* The strict template does not receive the legacy archive page stylesheet.
   Keep the square/cropped archive geometry in this skin. */
#browse-grid.square-grid,
#browse-grid.cropped-grid {
    display: grid;
    /* Shared archive controls keep legacy saved values as fallbacks. */
    grid-template-columns: repeat(var(--ss-cols, var(--grid-cols, 4)), minmax(0, var(--ss-thumb-size, var(--thumb-width, 200px))));
    gap: var(--ss-gap, var(--grid-gap, 50px));
    justify-content: center;
}
#browse-grid.square-grid .thumb-container,
#browse-grid.cropped-grid .thumb-container {
    position: relative;
    overflow: hidden;
    padding: var(--ss-thumb-padding, 0px);
    width: 100%;
    min-width: 0;
}
#browse-grid.square-grid .thumb-container { aspect-ratio: 1 / 1; }
#browse-grid.cropped-grid .thumb-container { width: 100%; }
@media (max-width: 600px) {
    #browse-grid.square-grid,
    #browse-grid.cropped-grid {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
        padding: 0 20px;
        margin: 40px auto;
    }
    #browse-grid .thumb-container { min-width: 0; width: 100%; }
}

/* --- GRID B: Justified (Own ID — ZERO shared selectors with Grid A) --- */
#justified-grid {
    display: block;
    max-width: 95%;
    margin: 40px auto;
    padding: 0;
    box-sizing: border-box;
    flex: 1 0 auto;
}

.square-grid .thumb-container,
.cropped-grid .thumb-container {
    margin: 0 auto;
    background: var(--bg-page);
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

/* ARCHIVE FRAME — scoped to Grid A only */
.square-grid .thumb-link,
.cropped-grid .thumb-link {
    display: inline-block;
    border-width: var(--ss-border-width, 1px);
    border-color: var(--ss-border-color, #666);
    border-style: var(--ss-border-style, solid);
    box-shadow: none;
    box-sizing: border-box;
}

/* Square grid: thumb-link fills the 1:1 cell */
.square-grid .thumb-link {
    display: block;
    width: 100%;
    height: 100%;
}
.square-grid .thumb-link img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Cropped grid: thumb-link fills cell, portraits/squares scoped by public-facing.css */
.cropped-grid .thumb-link {
    display: block;
    width: 100%;
    overflow: hidden;
}
.cropped-grid .thumb-link img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.square-grid .thumb-link img,
.cropped-grid .thumb-link img {
    max-width: 100%;
    height: auto;
    display: block;
    transition: opacity 0.3s ease;
}

.square-grid .thumb-link img:hover,
.cropped-grid .thumb-link img:hover {
    opacity: 0.7;
}

/* --- Justified item hover (separate chain, own container) --- */
#justified-grid .justified-item img {
    transition: opacity 0.3s ease;
}
#justified-grid .justified-item:hover img {
    opacity: 0.7;
}

/* ==========================================================================
    STATIC PAGE OVERRIDES (Symmetry Enforcement)
    ========================================================================= */

.static-transmission #scroll-stage {
    display: block !important;
    text-align: center !important;
}

.static-transmission #footer,
.static-transmission #system-footer,
.archive-page #footer,
.archive-page #system-footer {
    display: block !important;
    width: 100% !important;
    visibility: visible !important;
    position: relative; 
    z-index: 100;
}

.static-transmission #footer { background: var(--bg-secondary) !important; }
.static-transmission #system-footer { background: var(--bg-chrome) !important; border-top: 1px solid var(--border-accent) !important; }

/* THE LANE: Centered 850px container with 20px padding for symmetry */
.static-content {
    max-width: var(--static-content-width, 850px) !important;
    margin: 40px auto 0 auto !important;
    padding-left: 20px;
    padding-right: 20px;
    box-sizing: border-box;
    background: var(--bg-page);
    text-align: left;
    overflow-x: hidden;
}

.static-content::after { 
    content: ""; 
    display: table; 
    clear: both; 
}

/* THE TITLE: 24px Optical Snap to align with framed content below */
.static-page-title {
    width: 100% !important;
    max-width: 850px !important;
    margin: 0 0 40px 0 !important;
    padding-left: 24px !important; /* 20px baseline + 4px frame compensation */
    padding-right: 20px !important;
    text-align: left !important;
    display: block !important;
    box-sizing: border-box !important;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--text-bright);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 2rem;
    font-weight: 700;
}

/* THE BIO IMAGE: 17px Top (Baseline Snap) and 10px Left (Lane Shift) */
.static-transmission .description .align-left {
    float: left !important;
    margin: 17px 50px 25px 10px !important;
    border: 3px solid var(--border-accent) !important;
    box-shadow: none !important;
    max-width: 40% !important;
    height: auto !important;
    display: block !important;
}

/* Reset Hero Header vertical air */
.static-transmission #photobox.page-hero {
    display: block !important; 
    min-height: auto !important;
    /* #photobox is the PHOTOGRAPH page's box and is locked to
       calc(100dvh - 140px) so one photograph fills the screen. A static page
       hero is not that: it is an image in a column of text, and the fixed
       height left 58px of dead space under it on Sean's About page -- a
       square 2655x2655 photograph rendering 722x722 inside an 860px box.
       min-height was already released here; height never was, and without it
       the release does nothing. Measured on curbappeal.photoblogs.fyi: the box
       goes 860 to 802, which is the photograph plus the 40px .main-photo
       frame above and below it, even on both sides. */
    height: auto !important;
    padding: 0 !important; 
    width: auto !important;
    float: left !important; 
    background: transparent !important;
    margin: 0 !important;
}

/* Kill paragraph top interference to ensure baseline snap */
.static-transmission .description p:first-of-type {
    margin-top: 0 !important;
    padding-top: 0 !important;
}

/* Kill the manager's ghost break */
.static-transmission .description img + br {
    display: none !important;
}

/* ==========================================================================
    DASHBOARD & INLINE ASSETS (PARSED SHORTCODES)
    ========================================================================= */

.inline-asset, .snapsmack-asset, .snap-inline-frame {
    display: block;
    height: auto;
    box-sizing: border-box;
    border: 5px solid var(--border-accent) !important;
    box-shadow: none !important;
    /* PADDING UNDER: 60px space before the next paragraph */
    margin-top: 20px;
    margin-bottom: 60px !important;
}

/* ENFORCING THE LANE: 850px container minus the 42px of total frame depth */
.asset-full   { width: calc(100% - 42px) !important; margin-left: auto; margin-right: auto; }
.asset-medium { width: 50%; min-width: 300px; }
.asset-small  { width: 25%; min-width: 150px; }

/* Default Public Alignment Fallbacks */
.align-left { 
    float: left !important; 
    margin: 17px 50px 25px 10px !important; 
}

.align-right { 
    float: right !important; 
    margin: 5px 10px 25px 50px !important; 
}

.align-center { 
    float: none !important; 
    margin-left: auto !important; 
    margin-right: auto !important; 
}

/* ENFORCED: Clearfix for all description blocks */
.description::after { content: ""; display: table; clear: both; }

/* ─── DROPCAP ─────────────────────────────────────────────── */
/* Base rule — actual styling (float, size, colour) is driven  */
/* by the manifest dropcap_style option via custom-framing.    */
span.dropcap {
    display: inline;
}

/* ==========================================================================
    FORM & DASHBOARD UI (FULL RESTORATION)
    ========================================================================= */

#smack-form input[type="text"], 
#smack-form select, 
#smack-form-edit input[type="text"], 
#smack-form-edit select,
.input-control-row {
    height: 42px; 
    box-sizing: border-box;
}

.input-control-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-page);
    border: 1px solid var(--border-primary);
    padding: 0 10px;
}

.input-control-row input[type="text"] {
    border: none !important;
    background: transparent !important;
    padding: 0 !important;
    flex: 1;
}

.built-in-label {
    font-size: 0.7rem;
    white-space: nowrap;
    display: flex;
    align-items: center;
    margin: 0;
    padding-left: 10px;
    border-left: 1px solid var(--border-dim);
    color: var(--border-accent);
    height: 100%;
    cursor: pointer;
}

.built-in-label input[type="checkbox"] {
    margin-right: 6px;
}

/* Dropdown styling */
.custom-multiselect {
    position: relative;
    width: 100%;
}

.select-box {
    background: var(--bg-page);
    border: 1px solid var(--border-primary);
    color: var(--text-primary);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    cursor: pointer;
}

.dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    z-index: 100;
    max-height: 250px;
    overflow-y: auto;
}

.dropdown-search-wrapper {
    padding: 5px;
    border-bottom: 1px solid var(--border-dim);
}

.dropdown-search-wrapper input {
    width: 100%;
    background: var(--bg-page);
    border: 1px solid var(--border-primary);
    color: var(--text-bright);
    padding: 5px;
}

.multi-cat-item {
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    color: var(--text-secondary);
}

.multi-cat-item:hover {
    background: var(--bg-tertiary);
    color: var(--text-bright);
}

.multi-cat-item input {
    margin-right: 10px;
}

/* ==========================================================================
    ARCHIVE CONTROLS
    ========================================================================= */

#infobox .center {
    display: flex;
    gap: 40px; 
    align-items: center;
    justify-content: center;
}

#infobox .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
}

#infobox .filter-group form {
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
}

#infobox label.dim {
    margin-right: 8px;
    font-size: 0.7rem;
}

#infobox select {
    background: var(--bg-page);
    color: var(--text-primary);
    border: 1px solid var(--border-primary);
    padding: 5px;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    text-transform: uppercase;
    cursor: pointer;
}

#infobox select:focus {
    outline: none;
    border-color: var(--border-accent);
}

#infobox a.active {
    color: var(--text-bright);
    font-size: 0.75rem;
}

#infobox a.inactive {
    color: var(--text-muted);
    font-size: 0.75rem;
}

.empty-sector-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 100px;
    color: var(--text-faint);
    font-family: 'Courier New', monospace;
    letter-spacing: 2px;
}

/* ==========================================================================
    NOTICE & ERROR STATES
    ========================================================================= */

.hud-msg {
    position: fixed;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.95);
    color: #39FF14;
    border: 1px solid #39FF14;
    padding: 20px 40px;
    font-family: Georgia, 'Times New Roman', Times, serif;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 10000;
    transition: top 0.6s cubic-bezier(.2,.9,.2,1);
}

.hud-msg.show {
    top: 40px;
}

.sql-error-notice {
    background: #200;
    color: #f99;
    padding: 20px;
    font-family: monospace;
    border: 1px solid red;
}

.empty-gallery-msg, .not-found-msg {
    color: var(--text-link);
    text-align: center;
    padding: 100px 50px;
}

/* ==========================================================================
    REVISED FOOTER SPACING & LINKS
   ========================================================================= */

#system-footer .sep {
    display: inline-block;
    margin: 0 12px;
    color: var(--border-accent);
}

.footer-link {
    color: inherit;
    text-decoration: none;
    transition: color 0.3s ease;
}

.footer-link:hover {
    color: var(--text-bright);
}

.rss-tag {
    font-weight: normal;
    letter-spacing: 1px;
}

.reverse-email {
    unicode-bidi: bidi-override;
    direction: rtl;
}

/* ==========================================================================
    BLOGROLL (PUBLIC NETWORK LISTING)
    Controlled by manifest BLOGROLL section options.
    .blogroll-canvas is independent of .static-content so width is 
    separately tunable via the manifest max-width slider.
    ========================================================================== */

/* Outer canvas — width controlled by manifest blogroll_max_width */
.blogroll-canvas {
    max-width: 900px;
    margin: 40px auto 0 auto;
    padding: 0 20px;
    box-sizing: border-box;
    text-align: left;
}

/* Category block — wraps heading + grid for each category */
.blogroll-category-block {
    margin-bottom: 60px;
}

/* Category heading */
.blogroll-category-heading {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--border-accent);
    margin: 0 0 20px 0;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-dim);
}

/* Grid — columns controlled by manifest blogroll_columns select,
   gap controlled by manifest blogroll_col_gap slider */
.blogroll-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 60px;
}

/* Individual peer entry */
.blogroll-peer {
    padding-bottom: 24px;
    border-bottom: 1px solid var(--bg-secondary);
}

.blogroll-peer:last-child {
    border-bottom: none;
    padding-bottom: 0;
}

/* Peer name / link */
.blogroll-peer-name {
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 6px;
}

.blogroll-peer-name a {
    color: var(--text-primary);
    text-decoration: none;
    transition: color 0.2s ease;
}

.blogroll-peer-name a:hover {
    color: var(--text-bright);
}

/* Editorial description — display toggled by manifest blogroll_show_desc */
.blogroll-peer-desc {
    display: block;
    font-family: Georgia, 'Times New Roman', Times, serif;
    font-size: 0.9rem;
    color: var(--text-dim);
    line-height: 1.6;
    margin: 4px 0 8px 0;
    padding: 0;
}

/* URL — display toggled by manifest blogroll_show_url */
.blogroll-peer-url {
    display: block;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.5px;
    color: var(--text-faint);
}

/* ==========================================================================
   INLINE STYLE REMOVALS - CSS CLASSES
   ========================================================================= */

/* Pane default state — JS toggles visibility */
.footer-pane { display: none; }

/* Signals section */
.signals-header { margin-bottom: 40px; text-align: center; }
.signals-table { width: 100%; margin-bottom: 40px; }
.signal-date { font-size: 0.7rem; color: var(--text-faint); margin-top: 5px; }
.signals-empty { text-align: center; }


/* ==========================================================================
   NAV DROPDOWN
   Requires ss-engine-nav-dropdown.js (loaded by core/footer.php when
   nav_menu_json is configured). Classes emitted by core/header.php renderer.
   ========================================================================= */

.nav-has-children { position: relative; }

.nav-submenu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 180px;
    list-style: none;
    margin: 0;
    padding: 6px 0;
    z-index: 500;
    background: var(--nav-dropdown-bg, #111111);
    border: 1px solid rgba(128,128,128,0.2);
    border-radius: 3px;
}

.nav-has-children:hover > .nav-submenu,
.nav-has-children.open > .nav-submenu {
    display: block;
}

.nav-submenu li { display: block; }

.nav-submenu a,
.nav-submenu span {
    display: block;
    padding: 7px 18px;
    white-space: nowrap;
    color: var(--nav-dropdown-text, #cccccc);
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    transition: opacity 0.15s;
    opacity: 0.75;
}

.nav-submenu a:hover { opacity: 1; }


/* The menu separator. The CMS drew it until 0.7.873D, when a hard-coded
   pipe in the shared renderer was removed because it reached every skin
   at once -- including three that already drew their own, which then
   showed two. The character belongs to the skin. This reuses the colour
   and spacing this skin's own .sep span already had, so nothing changes
   but where it comes from. */
.nav-menu > li + li::before {
    content: "|";
    padding: 0 15px;
    color: var(--text-faint);
    cursor: default;
}

/* The masthead is an <a>, and the <a> itself must be styled.
   The wordmark span sets its own colour and text-decoration:none, but a
   descendant cannot cancel an underline drawn by its ancestor -- so the
   link rendered in the browser's default blue, underlined, and purple once
   visited. Skins written for the older markup target ".logo-area a", an
   anchor INSIDE a container; the renderer emits the anchor AS the
   container (<a class="site-title logo-area">), so that selector matches
   nothing. This covers both shapes and lets the wordmark's own colour show. */
a.site-title,
a.logo-area,
.site-title > a,
.logo-area > a {
    color: inherit;
    text-decoration: none;
}
#nh-sentinel {
    height: auto;
    min-height: 44px;
    padding: 16px 24px;
    text-align: center;
}
#nh-sentinel a { display: inline-block; padding: 12px; }
/* Shared community markup uses ss-* classes rather than the legacy form. */
#pane-comments .ss-community { padding: 24px 0 40px; }
#pane-comments .ss-comments { margin-top: 20px; }
#pane-comments .ss-comments-empty,
#pane-comments .ss-comment-empty { margin: 0 0 20px; color: var(--text-primary, #ccc); font-size: 1rem; line-height: 1.5; }
#pane-comments .ss-comment-guest-fields { display: flex; gap: 16px; margin-bottom: 8px; }
#pane-comments .ss-comment-guest-fields input,
#pane-comments .ss-comment-textarea {
    min-width: 0;
    min-height: 44px;
    background: var(--bg-page, #111);
    color: var(--text-primary, #ccc);
    border: 1px solid var(--border-primary, #555);
    border-radius: 0;
    padding: 12px;
    font: inherit;
    line-height: 1.5;
    box-sizing: border-box;
}
#pane-comments .ss-comment-guest-fields input { flex: 1; width: 100%; }
#pane-comments .ss-comment-textarea { min-height: 96px; resize: vertical; }
#pane-comments .ss-comment-guest-fields input::placeholder,
#pane-comments .ss-comment-textarea::placeholder { color: var(--text-dim, #999); opacity: 1; }
#pane-comments .ss-comment-guest-fields input:focus-visible,
#pane-comments .ss-comment-textarea:focus-visible { outline: 2px solid var(--text-bright, #eee); outline-offset: 2px; }

/* Font-role overrides keep their original shades until explicitly changed. */
.static-page-title, .photo-title-footer { color: var(--nh-heading-colour); }
.static-content { color: var(--nh-body-colour); }
.description { color: var(--nh-description-colour); }
#system-footer .inside, #system-footer p, #sig-text { color: var(--nh-footer-colour) !important; }

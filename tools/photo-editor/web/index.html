<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PIXEL TICKLER</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header><strong>PIXEL TICKLER</strong><span>SNAPSMACK PHOTO EDITOR</span><button id="open">Open</button><button id="save" class="primary">Save Copy</button></header>
  <main>
    <nav aria-label="Editing tools">
      <button data-op="rotate-270" title="Rotate left">↶</button><button data-op="rotate-90" title="Rotate right">↷</button>
      <button data-op="flip-horizontal">Flip H</button><button data-op="flip-vertical">Flip V</button>
      <button id="before">Before / After</button><button id="reset">Reset</button>
    </nav>
    <section id="stage" tabindex="0" aria-label="Image preview"><p>Open a JPEG, PNG, WebP, or TIFF to begin.</p><img id="preview" alt="Edited preview" hidden></section>
    <aside>
      <h1>Geometry</h1>
      <label>Preset<select id="preset"><option value="">Choose…</option><option value="punch">Clean punch</option><option value="soft">Soft portrait</option><option value="mono">Classic B&amp;W</option></select></label><button id="apply-preset">Apply preset</button>
      <fieldset><legend>Crop</legend><label>Ratio<select id="ratio"><option value="free">Free</option><option value="1:1">1:1</option><option value="4:3">4:3</option><option value="3:2">3:2</option><option value="16:9">16:9</option></select></label><label>X<input id="crop-x" type="number" min="0" value="0"></label><label>Y<input id="crop-y" type="number" min="0" value="0"></label><label>Width<input id="crop-width" type="number" min="1"></label><label>Height<input id="crop-height" type="number" min="1"></label><button id="crop">Apply crop</button></fieldset>
      <fieldset><legend>Straighten</legend><label>Angle <output id="angle-value">0.0°</output><input id="angle" type="range" min="-45" max="45" value="0" step="0.1"></label><button id="straighten">Apply straighten</button></fieldset>
      <fieldset><legend>Resize</legend><label>Width<input id="width" type="number" min="1" max="65535"></label><label>Height<input id="height" type="number" min="1" max="65535"></label><button id="resize">Apply resize</button></fieldset>
      <details open><summary>Darkroom</summary><div id="darkroom-controls">
        <label>Exposure <span><input data-darkroom="exposure" type="number" min="-5" max="5" value="0" step="0.1"><button data-reset="exposure" aria-label="Reset exposure">↺</button></span></label>
        <label>Contrast <span><input data-darkroom="contrast" type="number" min="-1" max="1" value="0" step="0.01"><button data-reset="contrast" aria-label="Reset contrast">↺</button></span></label>
        <label>Highlights <span><input data-darkroom="highlights" type="number" min="-1" max="1" value="0" step="0.01"><button data-reset="highlights" aria-label="Reset highlights">↺</button></span></label>
        <label>Shadows <span><input data-darkroom="shadows" type="number" min="-1" max="1" value="0" step="0.01"><button data-reset="shadows" aria-label="Reset shadows">↺</button></span></label>
        <label>Whites <span><input data-darkroom="whites" type="number" min="-1" max="1" value="0" step="0.01"><button data-reset="whites" aria-label="Reset whites">↺</button></span></label>
        <label>Blacks <span><input data-darkroom="blacks" type="number" min="-1" max="1" value="0" step="0.01"><button data-reset="blacks" aria-label="Reset blacks">↺</button></span></label>
        <label>Temperature <span><input data-darkroom="temperature" type="number" min="-1" max="1" value="0" step="0.01"><button data-reset="temperature" aria-label="Reset temperature">↺</button></span></label>
        <label>Tint <span><input data-darkroom="tint" type="number" min="-1" max="1" value="0" step="0.01"><button data-reset="tint" aria-label="Reset tint">↺</button></span></label>
        <label>Saturation <span><input data-darkroom="saturation" type="number" min="-1" max="1" value="0" step="0.01"><button data-reset="saturation" aria-label="Reset saturation">↺</button></span></label>
        <label>Vibrance <span><input data-darkroom="vibrance" type="number" min="-1" max="1" value="0" step="0.01"><button data-reset="vibrance" aria-label="Reset vibrance">↺</button></span></label>
        <button id="apply-darkroom">Apply darkroom adjustment</button>
      </div></details>
      <details><summary>Finishing</summary><div id="finishing-controls">
        <fieldset><legend>Levels</legend><label>Black<input id="level-black" type="number" min="0" max="0.99" value="0" step="0.01"></label><label>Midtone<input id="level-gamma" type="number" min="0.1" max="10" value="1" step="0.05"></label><label>White<input id="level-white" type="number" min="0.01" max="1" value="1" step="0.01"></label><button id="apply-levels">Apply levels</button></fieldset>
        <fieldset><legend>Black &amp; White Mix</legend><label>Red<input id="bw-red" type="number" min="0" max="2" value="0.3" step="0.05"></label><label>Green<input id="bw-green" type="number" min="0" max="2" value="0.6" step="0.05"></label><label>Blue<input id="bw-blue" type="number" min="0" max="2" value="0.1" step="0.05"></label><button id="apply-bw">Convert to B&amp;W</button></fieldset>
        <fieldset><legend>Vignette</legend><label>Amount<input id="vignette-amount" type="number" min="-1" max="1" value="0" step="0.05"></label><label>Midpoint<input id="vignette-midpoint" type="number" min="0" max="1" value="0.5" step="0.05"></label><label>Feather<input id="vignette-feather" type="number" min="0.01" max="1" value="0.5" step="0.05"></label><button id="apply-vignette">Apply vignette</button></fieldset>
        <fieldset><legend>Detail</legend><label>Sharpen amount<input id="sharpen-amount" type="number" min="0" max="2" value="0" step="0.05"></label><label>Edge threshold<input id="sharpen-threshold" type="number" min="0" max="1" value="0.01" step="0.01"></label><button id="apply-sharpen">Apply sharpening</button><label>Luminance NR<input id="nr-luminance" type="number" min="0" max="1" value="0" step="0.05"></label><label>Chroma NR<input id="nr-chroma" type="number" min="0" max="1" value="0" step="0.05"></label><button id="apply-noise">Apply noise reduction</button></fieldset>
        <fieldset><legend>Presence</legend><label>Local contrast<input id="local-contrast" type="number" min="0" max="2" value="0" step="0.05"></label><button id="apply-local-contrast">Apply local contrast</button><label>Haze reduction<input id="haze" type="number" min="-1" max="1" value="0" step="0.05"></label><button id="apply-haze">Apply haze reduction</button></fieldset>
        <fieldset><legend>Tone Curve</legend><label>Shadows<input id="curve-shadows" type="number" min="-1" max="1" value="0" step="0.05"></label><label>Midtones<input id="curve-midtones" type="number" min="-1" max="1" value="0" step="0.05"></label><label>Highlights<input id="curve-highlights" type="number" min="-1" max="1" value="0" step="0.05"></label><button id="apply-curve">Apply curve</button></fieldset>
        <fieldset><legend>HSL</legend><label>Hue degrees<input id="hsl-hue" type="number" min="-180" max="180" value="0" step="1"></label><label>Saturation<input id="hsl-saturation" type="number" min="-1" max="1" value="0" step="0.05"></label><label>Lightness<input id="hsl-lightness" type="number" min="-1" max="1" value="0" step="0.05"></label><button id="apply-hsl">Apply HSL</button></fieldset>
      </div></details>
      <details open><summary>Layers</summary><div id="layer-maker"><label>Name<input id="layer-name" value="Adjustment"></label><label>Blend<select id="layer-blend"><option value="normal">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option><option value="overlay">Overlay</option><option value="soft-light">Soft Light</option></select></label><label>Opacity<input id="layer-opacity" type="number" min="0" max="1" value="1" step="0.05"></label><label>Fill<input id="layer-fill" type="number" min="0" max="1" value="1" step="0.05"></label><button id="make-layer">Turn last edit into layer</button></div><ol id="layers" aria-label="Adjustment layers"></ol></details>
      <canvas id="histogram" width="256" height="100" aria-label="RGB histogram"></canvas>
      <output id="status" aria-live="polite">Ready</output>
    </aside>
  </main>
  <footer><button id="undo" disabled>Undo <kbd>Ctrl Z</kbd></button><button id="redo" disabled>Redo <kbd>Ctrl Shift Z</kbd></button><span>HEIC/HEIF is not supported.</span></footer>
  <script src="editor-host.js"></script><script src="editor.js"></script>
</body>
</html>
<!-- ===== SNAPSMACK EOF ===== -->

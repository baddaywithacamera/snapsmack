[package]
name = "pixel-tickler"
version = "0.1.0"
edition = "2021"
description = "PIXEL TICKLER Windows host"
license-file = "../../../../../licenses/SNAPSMACK-LICENSE.txt"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
serde_json = "1"
snapsmack-photo-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

[package]
name = "snapsmack-photo-core"
version = "0.1.0"
edition = "2021"
description = "PIXEL TICKLER native photo-processing sidecar"
license-file = "../../../licenses/SNAPSMACK-LICENSE.txt"
homepage = "https://snapsmack.ca"
repository = "https://github.com/baddaywithacamera/snapsmack"
publish = false

[dependencies]
base64 = "0.22"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "snapsmack_photo_core"
path = "src/lib.rs"

[[bin]]
name = "snapsmack-photo-core"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

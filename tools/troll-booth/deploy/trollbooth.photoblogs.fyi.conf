<VirtualHost *:80>
    ServerName trollbooth.photoblogs.fyi

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8765/ timeout=310
    ProxyPassReverse / http://127.0.0.1:8765/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/troll-booth-error.log
    CustomLog ${APACHE_LOG_DIR}/troll-booth-access.log combined
</VirtualHost>

